<title>Pixie Run Viewer</title>
<style>
  /* Layout: one full-bleed WebGL stage, caption chip top-left, shader toggle bottom-center. */
  :root {
    --bg: #e9ecef; --fg: #1d2a26; --muted: #5d6b66; --chip: rgba(255,255,255,.82); --grid: #b9c2bf;
    --accent: #2f8a4a; --accent-fg: #ffffff;
    --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1b1f1e; --fg: #e3ece8; --muted: #93a39d; --chip: rgba(20,24,23,.82); --grid: #3a4441;
    --accent: #5cc77a; --accent-fg: #0f1a13; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #1b1f1e; --fg: #e3ece8; --muted: #93a39d; --chip: rgba(20,24,23,.82); --grid: #3a4441;
    --accent: #5cc77a; --accent-fg: #0f1a13; color-scheme: dark }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .chip { background: var(--chip); border-radius: 6px; backdrop-filter: blur(6px); }
  #info {
    position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
    padding: 8px 12px; display: grid; gap: 2px; max-width: calc(100% - 32px);
  }
  #info b { font-size: 14px; }
  #info span { font: 12px var(--font-data); color: var(--muted); }
  #controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 4px; padding: 4px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px);
  }
  #controls button {
    font: 13px var(--font-ui); color: var(--fg); background: transparent; border: 0;
    padding: 7px 12px; border-radius: 4px; cursor: pointer;
  }
  #controls button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  #controls button:focus-visible, #light:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #light-wrap { display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 13px; color: var(--muted); }
  #light-wrap[hidden] { display: none; }
  #light { width: 120px; accent-color: var(--accent); }
  #face {
    position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
    padding: 8px; display: grid; gap: 6px; width: min(280px, calc(100% - 32px));
  }
  #face[hidden] { display: none; }
  #face .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  #say-status:empty { display: none; }
  #face .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
  #face button {
    font: 13px var(--font-ui); color: var(--fg); background: transparent; border: 1px solid var(--grid);
    padding: 5px 10px; border-radius: 4px; cursor: pointer;
  }
  #face button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #face button:focus-visible, #say-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #say-text {
    flex: 1; min-width: 0; font: 13px var(--font-ui); color: var(--fg); background: var(--bg);
    border: 1px solid var(--grid); border-radius: 4px; padding: 5px 8px;
  }
  @media (max-width: 640px) { #face { top: auto; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); } }
</style>
<div id="stage"></div>
<script id="glb" type="application/octet-stream">{{GLB_B64}}</script>
<script id="nas-params" type="application/json">{{PARAMS}}</script>
<div id="info" class="chip"><b>char_run.glb</b><span id="status">loading model…</span></div>
<div id="face" class="chip" role="group" aria-label="Face">
  <div class="row"><span class="label">Look</span>
    <button id="gaze-camera" type="button" aria-pressed="true">At camera</button>
    <button id="gaze-pointer" type="button" aria-pressed="false">At pointer</button>
    <button id="gaze-off" type="button" aria-pressed="false">Off</button>
    <button id="blink" type="button">Blink</button>
  </div>
  <form id="say" class="row"><span class="label">Say</span>
    <input id="say-text" type="text" value="Hi! I'm the Emerald Pixel Pixie. Nice to meet you!" aria-label="Text to speak">
    <button type="submit">Speak</button>
    <button id="voice" type="button" aria-pressed="true">Voice on</button>
  </form>
  <div id="say-status" class="label" aria-live="polite"></div>
</div>
<div id="controls" class="chip" role="group" aria-label="Shading">
  <button id="mode-genshin" type="button" aria-pressed="true">Genshin 2D</button>
  <button id="mode-nas" type="button" aria-pressed="false">NAS cel</button>
  <button id="mode-orig" type="button" aria-pressed="false">Original</button>
  <button id="pause" type="button" aria-pressed="false">Pause</button>
  <label id="light-wrap"><span>Light</span><input id="light" type="range" min="-180" max="180" step="1" value="-35" aria-label="Light angle around the character"></label>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>{{NAS_SHADER_JS}}</script>
<script>{{GENSHIN_JS}}</script>
<script>{{PUPPET_JS}}</script>
<script>
  const stage = document.getElementById('stage');
  const statusEl = document.getElementById('status');
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const P = JSON.parse(document.getElementById('nas-params').textContent);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.autoClear = false;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(2, 4, 3);
  scene.add(sun);

  let grid;
  function applyTheme() {
    scene.background = new THREE.Color(css('--bg'));
    if (grid) scene.remove(grid);
    grid = new THREE.GridHelper(4, 20, css('--grid'), css('--grid'));
    if (charHeight) grid.scale.setScalar(charHeight / 1.6);
    scene.add(grid);
  }
  let charHeight = 0;
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // Narrow FOV: less perspective distortion, closer to how anime 3D is framed.
  const camera = new THREE.PerspectiveCamera(24, 1, 0.01, 100);
  camera.position.set(0, 1, 3);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 0.8, 0);

  // ---- NAS cel shader: G-buffer passes + one full-screen compositor (mirrors nas/shader.py) ----
  const rtOpts = { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true };
  const rt = { albedo: new THREE.WebGLRenderTarget(1, 1, rtOpts), normal: new THREE.WebGLRenderTarget(1, 1, rtOpts),
               depth: new THREE.WebGLRenderTarget(1, 1, rtOpts) };
  const normalMat = new THREE.MeshNormalMaterial();
  const depthMat = new THREE.MeshDepthMaterial();
  let albedoMat, mesh, origMat;

  const composite = createNASMaterial(THREE, P);
  composite.uniforms.tAlbedo.value = rt.albedo.texture;
  composite.uniforms.tNormal.value = rt.normal.texture;
  composite.uniforms.tDepth.value = rt.depth.texture;
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), composite);
  quad.frustumCulled = false;
  const quadScene = new THREE.Scene();
  quadScene.add(quad);
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    const s = renderer.getDrawingBufferSize(new THREE.Vector2());
    for (const t of Object.values(rt)) t.setSize(s.x, s.y);
    composite.uniforms.texel.value.set(1 / s.x, 1 / s.y);
  }
  addEventListener('resize', resize);
  resize();

  let mode = 'genshin', paused = false, model, genshin, puppet;
  const lightWrap = document.getElementById('light-wrap');
  function setMode(m) {
    mode = m;
    for (const k of ['genshin', 'nas', 'orig']) document.getElementById('mode-' + k).setAttribute('aria-pressed', m === k);
    lightWrap.hidden = m !== 'genshin';
    if (!mesh) return;
    mesh.material = m === 'genshin' ? genshin.material : origMat;
    genshin.outline.visible = m === 'genshin';
  }
  for (const k of ['genshin', 'nas', 'orig']) document.getElementById('mode-' + k).onclick = () => setMode(k);
  document.getElementById('light').oninput = (e) => genshin && genshin.setLightAzimuth(+e.target.value);
  document.getElementById('pause').onclick = (e) => {
    paused = !paused;
    e.currentTarget.setAttribute('aria-pressed', paused);
    e.currentTarget.textContent = paused ? 'Play' : 'Pause';
  };

  let mixer;
  // The GLB is embedded as base64, since artifacts don't serve .glb files.
  const b64 = document.getElementById('glb').textContent.trim();
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  // GLTFLoader decodes embedded textures with fetch(blob:) when createImageBitmap exists,
  // which the artifact sandbox blocks. Hide it while the parser is built so it falls back
  // to TextureLoader (an <img> with a blob: src), which is allowed.
  const savedCIB = window.createImageBitmap;
  window.createImageBitmap = undefined;
  new THREE.GLTFLoader().parse(bytes.buffer, '', (gltf) => {
    model = gltf.scene;
    scene.add(model);
    model.traverse((o) => { if (o.isMesh) { mesh = o; origMat = o.material; } });
    // Albedo pass writes the texture's raw sRGB bytes (no decode), matching the training G-buffers.
    const rawMap = origMat.map.clone();
    rawMap.encoding = THREE.LinearEncoding;
    rawMap.needsUpdate = true;
    albedoMat = new THREE.MeshBasicMaterial({ map: rawMap });
    genshin = createGenshin(THREE, mesh, P);
    genshin.material.uniforms.map.value = rawMap;
    genshin.outline.material.uniforms.map.value = rawMap;
    // Puppet the model's own face (mesh deformation + head/neck look-at) in every mode.
    puppet = createFacePuppet(THREE, mesh);
    puppet.patch(origMat, 'linear');  // PBR shading runs in linear
    for (const m of [albedoMat, normalMat, depthMat, genshin.material, genshin.outline.material]) puppet.patch(m, 'srgb');

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    model.position.y -= box.min.y;
    charHeight = size.y;
    grid.scale.setScalar(size.y / 1.6);
    controls.target.set(0, size.y / 2, 0);
    camera.position.set(size.y * 1.0, size.y * 0.9, size.y * 3.6);
    controls.update();

    mixer = new THREE.AnimationMixer(model);
    gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
    const clips = gltf.animations.map((a) => `${a.name} ${a.duration.toFixed(2)}s`).join(', ') || 'no animation';
    statusEl.textContent = `${clips} · drag to orbit · scroll to zoom`;
    setMode(mode);
  }, (err) => {
    statusEl.textContent = 'Could not load char_run.glb: ' + (err.message || err);
  });
  window.createImageBitmap = savedCIB;

  function gbufferPass(target, material) {
    mesh.material = material;
    renderer.setRenderTarget(target);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(model, camera);
  }

  function renderNAS() {
    // Grid + background first, without the character.
    model.visible = false;
    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(scene, camera);
    model.visible = true;

    gbufferPass(rt.albedo, albedoMat);
    gbufferPass(rt.normal, normalMat);
    // Depth uses the same tight near/far window as training (camera distance ± 0.6 × height).
    const near = camera.near, far = camera.far;
    const dist = camera.position.distanceTo(controls.target);
    camera.near = Math.max(0.01, dist - charHeight * 0.6); camera.far = dist + charHeight * 0.6;
    camera.updateProjectionMatrix();
    gbufferPass(rt.depth, depthMat);
    camera.near = near; camera.far = far;
    camera.updateProjectionMatrix();
    mesh.material = origMat;

    renderer.setRenderTarget(null);
    renderer.render(quadScene, quadCam);
  }

  // ---- Face puppet animation: look target, auto-blink, text-driven mouth shapes ----
  const faceAnim = {
    gazeMode: 'camera', pointer: new THREE.Vector2(), eyeOpen: 1,
    blinkT: -1, nextBlink: 2, speech: [], speechT: 0,
    mouth: { open: 0, width: 1 }, mouthTarget: { open: 0, width: 1 },
  };
  // Viseme per letter: [open, width]. Vowels open the mouth; m/b/p close it; other consonants half-close.
  const VISEMES = { a: [1.0, 1.0], i: [0.35, 1.25], u: [0.5, 0.6], e: [0.55, 1.15], o: [0.8, 0.75], y: [0.35, 1.2] };
  // Mouth timeline from text; each entry remembers its character index so the voice can resync it.
  function visemes(text) {
    const seq = [];
    [...text.toLowerCase()].forEach((ch, ci) => {
      if (VISEMES[ch]) seq.push({ v: VISEMES[ch], d: 0.11, ci });
      else if ('mbp'.includes(ch)) seq.push({ v: [0, 0.9], d: 0.07, ci });
      else if (/[a-z]/.test(ch)) seq.push({ v: [0.22, 1.0], d: 0.055, ci });
      else if (/[.!?,]/.test(ch)) seq.push({ v: [0, 1], d: 0.28, ci });
      else if (ch === ' ') seq.push({ v: [0.08, 1], d: 0.05, ci });
    });
    seq.push({ v: [0, 1], d: 0.2, ci: text.length });
    return seq;
  }
  let voiceOn = true;
  const sayStatus = document.getElementById('say-status');
  function pickVoice() {
    const voices = speechSynthesis.getVoices();
    const en = voices.filter((v) => /^en/i.test(v.lang));
    return en.find((v) => /female|samantha|zira|aria|jenny|google uk english female|karen|moira|tessa/i.test(v.name)) || en[0] || voices[0] || null;
  }
  function speak(text) {
    const seq = visemes(text);
    const startMouth = () => { faceAnim.speech = seq.slice(); faceAnim.speechT = 0; };
    if (!voiceOn || !('speechSynthesis' in window)) {
      sayStatus.textContent = voiceOn ? 'This browser has no speech voice; mouth only.' : '';
      startMouth();
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voice = pickVoice();
    if (voice) u.voice = voice;
    u.pitch = 1.6; u.rate = 1.05;
    let started = false;
    u.onstart = () => { started = true; sayStatus.textContent = ''; startMouth(); };
    // Resync the mouth to each word the voice reaches.
    u.onboundary = (e) => {
      if (e.name && e.name !== 'word') return;
      while (faceAnim.speech.length > 1 && faceAnim.speech[0].ci < e.charIndex) faceAnim.speech.shift();
      faceAnim.speechT = 0;
    };
    u.onend = () => { faceAnim.speech = [{ v: [0, 1], d: 0.2, ci: 0 }]; faceAnim.speechT = 0; };
    u.onerror = (e) => { if (!started) { sayStatus.textContent = `Voice unavailable (${e.error}); mouth only.`; startMouth(); } };
    speechSynthesis.speak(u);
    // If the voice never starts (blocked or no voices), still animate the mouth.
    setTimeout(() => { if (!started) { sayStatus.textContent = 'No voice started; mouth only.'; startMouth(); } }, 900);
  }
  document.getElementById('say').addEventListener('submit', (e) => { e.preventDefault(); speak(document.getElementById('say-text').value); });
  document.getElementById('voice').onclick = (e) => {
    voiceOn = !voiceOn;
    e.currentTarget.setAttribute('aria-pressed', voiceOn);
    e.currentTarget.textContent = voiceOn ? 'Voice on' : 'Voice off';
    if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  };
  document.getElementById('blink').onclick = () => { faceAnim.blinkT = 0; };
  for (const m of ['camera', 'pointer', 'off']) document.getElementById('gaze-' + m).onclick = () => {
    faceAnim.gazeMode = m;
    for (const k of ['camera', 'pointer', 'off']) document.getElementById('gaze-' + k).setAttribute('aria-pressed', k === m);
  };
  renderer.domElement.addEventListener('pointermove', (e) => {
    const r = renderer.domElement.getBoundingClientRect();
    faceAnim.pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  });
  const _ray = new THREE.Raycaster(), _p = new THREE.Vector3();
  // Sets the puppet's inputs for this frame (call before puppet.update).
  function updateFace(dt) {
    const A = faceAnim;
    // Look: toward the camera, toward the point under the pointer at the head's depth, or off.
    puppet.lookEnabled = A.gazeMode !== 'off';
    if (A.gazeMode === 'camera') puppet.lookTarget.copy(camera.position);
    else if (A.gazeMode === 'pointer') {
      _ray.setFromCamera(A.pointer, camera);
      _ray.ray.at(_ray.ray.origin.distanceTo(controls.target) * 0.9, _p);
      puppet.lookTarget.copy(_p);
    }
    // Blink: ~160 ms close/open, every 2-6 s.
    A.nextBlink -= dt;
    if (A.nextBlink <= 0 && A.blinkT < 0) { A.blinkT = 0; A.nextBlink = 2 + Math.random() * 4; }
    if (A.blinkT >= 0) {
      A.blinkT += dt;
      const t = A.blinkT / 0.16;
      A.eyeOpen = t < 0.45 ? 1 - t / 0.45 : Math.min(1, (t - 0.55) / 0.45);
      if (t >= 1) { A.blinkT = -1; A.eyeOpen = 1; }
    }
    puppet.blink[0] = puppet.blink[1] = A.eyeOpen;
    // Speech: step through mouth shapes, ease toward each target.
    if (A.speech.length) {
      A.speechT += dt;
      while (A.speech.length && A.speechT > A.speech[0].d) { A.speechT -= A.speech[0].d; A.speech.shift(); }
      const cur = A.speech[0] ? A.speech[0].v : [0, 1];
      A.mouthTarget.open = cur[0]; A.mouthTarget.width = cur[1];
    }
    const k = 1 - Math.exp(-dt * 22);
    A.mouth.open += (A.mouthTarget.open - A.mouth.open) * k;
    A.mouth.width += (A.mouthTarget.width - A.mouth.width) * k;
    puppet.mouthOpen = A.mouth.open; puppet.mouthWidth = A.mouth.width;
  }

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = clock.getDelta();
    if (puppet) puppet.beginFrame();
    if (mixer && !paused && !matchMedia('(prefers-reduced-motion: reduce)').matches) mixer.update(dt);
    if (puppet) { updateFace(dt); puppet.update(dt); }
    controls.update();
    if (mode === 'nas' && mesh) {
      renderNAS();
    } else {
      if (mode === 'genshin' && genshin) genshin.update(camera, renderer);
      renderer.setRenderTarget(null);
      renderer.clear();
      renderer.render(scene, camera);
    }
  });
</script>
